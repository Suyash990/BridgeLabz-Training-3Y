<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6 - CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q06_transformations.css">
</head>
<body>
    <header>
        <h1>CSS 2D Transformations Showcase</h1>
        <p class="subtitle">Hover over each box to activate rotate(), scale(), translate(), and skew() 2D transforms.</p>
    </header>

    <main class="transform-wrapper">
        <!-- Box 1: Rotate -->
        <div class="box-card">
            <div class="transform-box box-rotate">Rotate</div>
            <div class="transform-label">rotate(45deg)</div>
        </div>

        <!-- Box 2: Scale -->
        <div class="box-card">
            <div class="transform-box box-scale">Scale</div>
            <div class="transform-label">scale(1.25)</div>
        </div>

        <!-- Box 3: Translate -->
        <div class="box-card">
            <div class="transform-box box-translate">Translate</div>
            <div class="transform-label">translateY(-25px)</div>
        </div>

        <!-- Box 4: Skew -->
        <div class="box-card">
            <div class="transform-box box-skew">Skew</div>
            <div class="transform-label">skewX(-20deg)</div>
        </div>
    </main>
</body>
</html>
