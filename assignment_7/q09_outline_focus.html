<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="q08_box_model.css">
</head>
<body>
    <div class="form-card">
        <h1>Outline &amp; Focus Styling Form</h1>
        <p>Click inside input fields to test custom outline styles, outline-offset, and :focus indicators.</p>

        <form action="#" method="post">
            <!-- Field 1: Solid Outline + 4px Offset -->
            <div class="form-group">
                <label for="field1">Full Name (Solid Blue Outline + 4px Offset):</label>
                <input type="text" id="field1" name="fullname" placeholder="Click to focus..." required>
            </div>

            <!-- Field 2: Dashed Outline + 3px Offset -->
            <div class="form-group">
                <label for="field2">Email Address (Dashed Green Outline + 3px Offset):</label>
                <input type="email" id="field2" name="email" placeholder="Click to focus..." required>
            </div>

            <!-- Field 3: Double Outline + 2px Offset -->
            <div class="form-group">
                <label for="field3">Message (Double Amber Outline + 2px Offset):</label>
                <textarea id="field3" name="message" placeholder="Click to focus..." required></textarea>
            </div>

            <button type="submit">Submit Form</button>
        </form>
    </div>
</body>
</html>
