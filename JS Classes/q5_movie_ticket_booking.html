<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
</head>
<body>

    <h2>Movie Ticket Booking Form</h2>

    <form id="bookingForm">
        <label>Name:</label>
        <input type="text" id="name">
        <br><br>

        <label>Email:</label>
        <input type="text" id="email">
        <br><br>

        <label>Seats (1-10):</label>
        <input type="number" id="seats">
        <br><br>

        <button type="submit">Book Ticket</button>
    </form>

    <h3>Ticket Details</h3>
    <p id="result"></p>

    <script>
        class MovieBooking {
            constructor(name, email, seats) {
                this.name = name;
                this.email = email;
                this.seats = seats;
            }

            displayDetails() {
                return `Name: ${this.name}<br>
                        Email: ${this.email}<br>
                        Seats: ${this.seats}`;
            }
        }

        document.getElementById("bookingForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const seats = Number(document.getElementById("seats").value);

            const nameRegex = /^[A-Za-z ]+$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!nameRegex.test(name)) {
                alert("Name must contain only alphabets.");
                return;
            }

            if (!emailRegex.test(email)) {
                alert("Enter a valid email address.");
                return;
            }

            if (!Number.isInteger(seats) || seats < 1 || seats > 10) {
                alert("Seats must be between 1 and 10.");
                return;
            }

            const booking = new MovieBooking(name, email, seats);

            const bookingInfo = {
                name: booking.name,
                email: booking.email,
                seats: booking.seats
            };

            console.log(bookingInfo);

            document.getElementById("result").innerHTML = booking.displayDetails();

            alert("Ticket booked successfully!");
        });
    </script>

</body>
</html>
