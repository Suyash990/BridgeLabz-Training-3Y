<!DOCTYPE html>
<html>
<head>
    <title>Custom Form Builder</title>
</head>
<body>

    <h2>Dynamic Form Builder</h2>

    <div id="formContainer"></div>

    <script>
        class FormBuilder {
            constructor(fields) {
                this.fields = fields;
            }

            createForm() {
                let formHTML = "<form id='dynamicForm'>";

                this.fields.forEach(field => {
                    formHTML += `
                        <label>${field.label}:</label><br>
                        <input type="${field.type}" name="${field.name}" required>
                        <br><br>
                    `;
                });

                formHTML += "<button type='submit'>Submit</button>";
                formHTML += "</form>";

                document.getElementById("formContainer").innerHTML = formHTML;

                document.getElementById("dynamicForm").addEventListener("submit", (event) => {
                    event.preventDefault();

                    const formData = this.getFormData();
                    console.log(formData);
                    alert("Form submitted successfully!");
                });
            }

            getFormData() {
                const form = document.getElementById("dynamicForm");
                const formData = {};

                this.fields.forEach(field => {
                    formData[field.name] = form.elements[field.name].value;
                });

                return formData;
            }
        }

        const fields = [
            { type: "text", label: "Username", name: "username" },
            { type: "email", label: "Email", name: "email" },
            { type: "password", label: "Password", name: "password" },
            { type: "number", label: "Age", name: "age" }
        ];

        const builder = new FormBuilder(fields);
        builder.createForm();
    </script>

</body>
</html>
