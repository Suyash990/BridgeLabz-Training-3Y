<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 15px;
        }

        .gallery img {
            width: 150px;
            height: 120px;
            object-fit: cover;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            width: 500px;
            max-width: 90%;
            max-height: 85vh;
        }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/400/300">
        <img src="https://picsum.photos/id/1016/400/300">
        <img src="https://picsum.photos/id/1018/400/300">
        <img src="https://picsum.photos/id/1020/400/300">
        <img src="https://picsum.photos/id/1024/400/300">
        <img src="https://picsum.photos/id/1035/400/300">
    </div>

    <div class="modal" id="modal">
        <img id="modalImage">
    </div>

    <script>
        const gallery = document.querySelector(".gallery");
        const modal = document.getElementById("modal");
        const modalImage = document.getElementById("modalImage");

        gallery.addEventListener("click", function(e) {
            if (e.target.tagName === "IMG") {
                modalImage.src = e.target.src;
                modal.style.display = "flex";
            }
        });

        modal.addEventListener("click", function() {
            modal.style.display = "none";
        });

        modalImage.addEventListener("click", function(e) {
            e.stopPropagation();
        });
    </script>

</body>
</html>
