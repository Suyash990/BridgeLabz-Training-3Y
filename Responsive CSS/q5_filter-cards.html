<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="q5_filter-cards.css">
</head>

<body>

    <main>
        <section class="profiles">

            <article class="card">
                <img class="grayscale" src="https://i.pravatar.cc/400?img=12" alt="Profile 1">
                <h2>Alex</h2>
                <p>Web Developer</p>
            </article>

            <article class="card">
                <img class="sepia" src="https://i.pravatar.cc/400?img=32" alt="Profile 2">
                <h2>Sarah</h2>
                <p>UI Designer</p>
            </article>

            <article class="card">
                <img class="brightness" src="https://i.pravatar.cc/400?img=47" alt="Profile 3">
                <h2>John</h2>
                <p>Data Analyst</p>
            </article>

        </section>
    </main>

</body>
</html>
