<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="q8_filter-comparison-layout.css">
</head>

<body>

    <main>
        <section class="comparison">

            <figure>
                <img src="https://picsum.photos/id/1015/600/400" alt="Original Image">
                <figcaption>Before</figcaption>
            </figure>

            <figure>
                <img class="filtered" src="https://picsum.photos/id/1015/600/400" alt="Filtered Image">
                <figcaption>After</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
