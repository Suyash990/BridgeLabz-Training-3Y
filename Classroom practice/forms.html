<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Name: </label>
        <input id="name" type="text" placeholder="Enter your Name" name="name">
        <br>
        <br>

        <label for="email">Email: </label>
        <input id="email" type="email" placeholder="Enter your email id" name="email">
        <br>
        <br>
        <label for="phone">Phone No: </label>
        <input id="phone" type="number" placeholder="Enter your phone" name="phone">
        <br>
        <br>
        <label for="pass">Password: </label>
        <input id="pass" type="password" name="pass">
        <br>
        <br>
        <label>Skill: </label>
        <select name="skill" size="3">
            <option value="Html">Html</option>
            <option value="CSS">CSS</option>
            <option value="CSS">CSS</option>
            <option value="CSS">CSS</option>
            <option value="CSS">CSS</option>
            <option value="Js">Js</option>
        </select>
        <br>
        <br>
        <section>
            <label>Gender: </label>
            <input id="male" type="radio" name="gender" value="male">
            <label for="male">Male</label>
            <input id="female" type="radio" name="gender" value="female">
            <label for="female">Female</label>
            <input id="others" type="radio" name="gender" value="others">
            <label for="others">Others</label>
        </section>
        <br>
        <section>
            <label>Skills: </label>
            <input type="checkbox" value="html">
            <label>Html</label>
            <input type="checkbox" value="CSS">
            <label>CSS</label>
            <input type="checkbox" value="Js">
            <label>Js</label>
        </section>
            
        <br>
        <label for="date">Date</label>
        <input id="date" type="date" name="date">
        <textarea></textarea>
            <br>
        <button>Submit</button>
    </form>
</body>
</html>
