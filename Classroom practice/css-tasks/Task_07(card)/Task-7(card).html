<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="Task-7(card).css">
</head>

<body>

    <div class="card">

        <!-- Image Section -->
        <div class="image-section">

            <img src="shoes.png" alt="Running Shoe">

            <div class="discount">
                20% OFF
            </div>

            <div class="heart">
                ♡
            </div>

        </div>


        <!-- Product Details -->
        <div class="details">

            <div class="category">
                SPORTS SHOES
            </div>

            <h2>
                Premium Running Shoes
            </h2>

            <div class="rating">
                <span>★</span>
                <span>★</span>
                <span>★</span>
                <span>★</span>
                <span>★</span>

                <span class="reviews">(120)</span>
            </div>


            <div class="price">
                <strong>₹1,999</strong>
                <del>₹2,409</del>
            </div>


            <button>
                Add to Cart
            </button>

        </div>

    </div>

</body>
</html>
