<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 10 - Contact Form</title>
</head>
<body>
    <h1>Contact Us</h1>

    <form action="#" method="post">
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="name@example.com" required><br><br>

        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" placeholder="Reason for contacting" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="6" cols="45" placeholder="Type your message here..." required></textarea><br><br>

        <input type="submit" value="Send Message">
    </form>
</body>
</html>
