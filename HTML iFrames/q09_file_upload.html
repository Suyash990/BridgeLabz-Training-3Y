<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - File Upload Form</title>
</head>
<body>
    <h1>Upload Profile Picture</h1>

    <form action="#" method="post" enctype="multipart/form-data">
        <label for="file_upload">Select File to Upload:</label><br>
        <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png, image/jpeg, image/png"><br><br>

        <p><strong>Note:</strong> Only image files with <code>.jpg</code> or <code>.png</code> extensions are allowed for upload.</p>

        <input type="submit" value="Upload File">
    </form>
</body>
</html>
