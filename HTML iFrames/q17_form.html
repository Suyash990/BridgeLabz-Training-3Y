<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 17 - Form with IFrame Target</title>
</head>
<body>
    <h1>Submit Data</h1>

    <form action="result.html" method="get" target="result_frame">
        <label for="user_input">Enter Text:</label><br>
        <input type="text" id="user_input" name="user_input" required><br><br>

        <input type="submit" value="Submit">
    </form>

    <br>
    <h3>Result Output:</h3>
    <iframe name="result_frame" title="Submission Result Frame" width="500" height="150"></iframe>
</body>
</html>
