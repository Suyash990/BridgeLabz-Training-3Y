<!DOCTYPE html>

    <title>Question 16 - URI Encoding Demonstration</title>
</head>
<body>
    <h1>URI Encoding Demonstration</h1>

    <p>
        Original search query: <code>https://example.com/search?query=HTML & CSS</code>
    </p>

    <p>
        In URLs, spaces are encoded as <code>%20</code> and ampersands as <code>%26</code>.
    </p>

    <p>
        <strong>Correctly Encoded Link:</strong><br>
        <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS (https://example.com/search?query=HTML%20%26%20CSS)</a>
    </p>
</body>
</html>
