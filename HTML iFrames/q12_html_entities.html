    <title>Question 12 - HTML Entities</title>
</head>
<body>
    <h1>HTML Entities Demonstration</h1>

    <p>
        <strong>Basic Special Characters:</strong><br>
        Less than: &lt; (<code>&amp;lt;</code>)<br>
        Greater than: &gt; (<code>&amp;gt;</code>)<br>
        Ampersand: &amp; (<code>&amp;amp;</code>)<br>
        Double quote: &quot; (<code>&amp;quot;</code>)<br>
        Single quote / Apostrophe: &apos; (<code>&amp;apos;</code>)
    </p>

    <p>
        <strong>Symbol Entities:</strong><br>
        Copyright: &copy; (<code>&amp;copy;</code>)<br>
        Trademark: &trade; (<code>&amp;trade;</code>)<br>
        Registered Trademark: &reg; (<code>&amp;reg;</code>)
    </p>
</body>
</html>
