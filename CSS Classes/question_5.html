<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5 - Styled Button Collection</title>
    <link rel="stylesheet" href="style_5.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Demonstrating Primary, Secondary, Outline, and Disabled buttons with Flexbox alignment, hover transitions, and focus indicators.</p>
    </header>

    <main class="button-container">
        <!-- Primary Button -->
        <button class="btn btn-primary">Primary Button</button>

        <!-- Secondary Button -->
        <button class="btn btn-secondary">Secondary Button</button>

        <!-- Outline Button -->
        <button class="btn btn-outline">Outline Button</button>

        <!-- Disabled Button -->
        <button class="btn" disabled>Disabled Button</button>
    </main>
</body>
</html>
