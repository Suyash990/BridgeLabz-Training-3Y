<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6 - CSS Animation Demonstration Page</title>
    <link rel="stylesheet" href="style_6.css">
</head>
<body>
    <header>
        <h1>CSS Keyframe Animations</h1>
        <p>Demonstrating @keyframes with animation-delay, iteration-count, and alternate directions centered on page.</p>
    </header>

    <main class="animation-container">
        <!-- Animation 1: Bouncing Ball -->
        <div class="animation-card">
            <div class="bouncing-ball"></div>
            <div class="animation-label">Bouncing Ball</div>
        </div>

        <!-- Animation 2: Pulse & Morph Box -->
        <div class="animation-card">
            <div class="pulse-box"></div>
            <div class="animation-label">Pulse &amp; Morph Box</div>
        </div>

        <!-- Animation 3: Color-Changing Text -->
        <div class="animation-card">
            <div class="color-text">COLOR WAVE</div>
            <div class="animation-label">Glow Color Cycle</div>
        </div>
    </main>
</body>
</html>
