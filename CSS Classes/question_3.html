<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3 - Image Showcase Layout</title>
    <link rel="stylesheet" href="style_3.css">
</head>
<body>
    <header>
        <h1>Responsive Image Showcase</h1>
        <p>Displaying six images in a modern grid layout with hover scale transforms and overlay captions.</p>
    </header>

    <main class="gallery-grid">
        <!-- Image 1 -->
        <figure class="image-card">
            <div class="img-container">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain Landscape">
                <div class="overlay"></div>
            </div>
            <figcaption>Majestic Alpine Peaks</figcaption>
        </figure>

        <!-- Image 2 -->
        <figure class="image-card">
            <div class="img-container">
                <img src="https://picsum.photos/id/1018/600/400" alt="Forest Trail">
                <div class="overlay"></div>
            </div>
            <figcaption>Autumn Woodland Trail</figcaption>
        </figure>

        <!-- Image 3 -->
        <figure class="image-card">
            <div class="img-container">
                <img src="https://picsum.photos/id/1025/600/400" alt="Wilderness Ocean">
                <div class="overlay"></div>
            </div>
            <figcaption>Coastal Sunset Vista</figcaption>
        </figure>

        <!-- Image 4 -->
        <figure class="image-card">
            <div class="img-container">
                <img src="https://picsum.photos/id/1039/600/400" alt="Waterfall Stream">
                <div class="overlay"></div>
            </div>
            <figcaption>Cascading Mountain Stream</figcaption>
        </figure>

        <!-- Image 5 -->
        <figure class="image-card">
            <div class="img-container">
                <img src="https://picsum.photos/id/1043/600/400" alt="Modern Architecture">
                <div class="overlay"></div>
            </div>
            <figcaption>Contemporary Skyline Architecture</figcaption>
        </figure>

        <!-- Image 6 -->
        <figure class="image-card">
            <div class="img-container">
                <img src="https://picsum.photos/id/1050/600/400" alt="Reflective Lake">
                <div class="overlay"></div>
            </div>
            <figcaption>Serene Mirror Lake</figcaption>
        </figure>
    </main>
</body>
</html>
